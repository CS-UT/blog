site_name: انجمن علمی علوم کامپیوتر دانشگاه تهران
site_description: انجمن علمی علوم کامپیوتر دانشگاه تهران
site_author: انجمن علمی علوم کامپیوتر
site_url: https://blog.csut.ir

# Theme configuration
theme:
  name: material
  language: fa
  direction: rtl
  logo: images/csut_white_transparent_logo.png
  favicon: images/favicon.png
  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # Table of contents
    - toc.follow
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: تغییر به حالت تاریک
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: تغییر به حالت روشن

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/UTCS_SA
      name: تلگرام
    - icon: fontawesome/brands/github
      link: https://github.com/CS-UT
      name: گیت‌هاب

# Plugins
plugins:
  - search
  - blog:
      blog_dir: blog
      authors_file: .authors.yml
      post_date_format: long
      post_readtime: true
      archive_date_format: MMMM yyyy
      categories_allowed:
        - آموزش
        - اخبار
        - پروژه
        - مسابقه
  - footermatter:
      author_map:
        - "محمدعرفان گونه | | "
  - tags

# Markdown extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: فهرست مطالب
  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: CS-UT
      repo: blog
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - خانه: index.md
  - بلاگ:
    - blog/index.md
  - مقالات:
    - فهرست مقالات: articles/index.md
    - استگانوگرافی: articles/steganography/index.md
  - برچسب‌ها: tags.md

# Extra CSS
extra_css:
  - stylesheets/vazir.css
  - stylesheets/custom.css

# Extra JavaScript for MathJax
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
