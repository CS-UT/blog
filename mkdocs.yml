site_name: انجمن علمی علوم کامپیوتر دانشگاه تهران
site_description: انجمن علمی علوم کامپیوتر دانشگاه تهران
site_author: انجمن علمی علوم کامپیوتر

# Theme configuration
theme:
  name: material
  language: fa
  logo: images/csut_white_transparent_logo.png
  favicon: images/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: تغییر به حالت تاریک
    # Dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: تغییر به حالت روشن

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/UTCS_SA
    - icon: fontawesome/brands/github
      link: https://github.com/CS-UT

# Plugins
plugins:
  - search
  - material/blog:
      blog_dir: blog
      authors_file: .authors.yml
  - footermatter:
      author_map:
        - "محمدعرفان گونه | | "

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - خانه: index.md
  - بلاگ:
    - بلاگ: blog/index.md
  - مقالات:
    - فهرست مقالات: articles/index.md
    - استگانوگرافی: articles/steganography/index.md
# Extra CSS
extra_css:
  - stylesheets/vazir.css
  - stylesheets/custom.css

