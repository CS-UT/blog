site_name: انجمن علمی علوم کامپیوتر دانشگاه تهران
site_description: انجمن علمی علوم کامپیوتر دانشگاه تهران
site_author: انجمن علمی علوم کامپیوتر

# Theme configuration
theme:
  name: material
  language: fa
  logo: images/csut_white_transparent_logo.png
  favicon: images/favicon.png
  palette:
    # Light mode
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: تغییر به حالت تاریک
    # Dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: تغییر به حالت روشن

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/telegram
      link: https://t.me/UTCS_SA

# Plugins
plugins:
  - search

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

# Navigation
nav:
  - استگانوگرافی: steganography.md

# Extra CSS
extra_css:
  - stylesheets/vazir.css
  - stylesheets/custom.css

